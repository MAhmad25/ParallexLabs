[project]
name = "week-5"
version = "0.1.0"
description = "Week 5: FastAPI RAG service with retrieval and generation evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.115.0",
    "google-genai>=2.31.0,<3.0.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.8,<2.0",
    "uvicorn[standard]>=0.34.0",
    "vaderSentiment>=3.3.2,<4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
