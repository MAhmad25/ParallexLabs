[project]
name = "week-4"
version = "0.1.0"
description = "Week 4: LDA topic modeling, VADER sentiment, and metadata-filtered retrieval"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "google-genai>=2.31.0,<3.0.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.8,<2.0",
    "vaderSentiment>=3.3.2,<4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
